#
# Active ESL fork infrastructure. Do not include this fork-only workflow in an
# apache/nuttx pull request.

name: Active ESL pre-upstream

on:
  push:
    branches:
      # Keep legacy EVK contributions alongside current FRDM work.
      - "feat/mimxrt1180-*"
      - "feat/frdm-*"
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
  workflow_dispatch:
    inputs:
      ref:
        description: Fork branch, tag, or SHA to test
        required: true
        default: feat/frdm-imxrt1186-cm33-nsh
        type: string
      base_ref:
        description: Apache base branch used for the contribution range
        required: true
        default: master
        type: string
      board_configs:
        description: Space-separated board configurations to build
        required: true
        default: frdm-imxrt1186:nsh
        type: string
      run_docs:
        description: Reproduce the Apache documentation build
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: aesl-pre-upstream-${{ github.event.pull_request.head.ref || inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  TEST_REF: ${{ github.event.pull_request.head.sha || inputs.ref || github.sha }}
  BASE_REF: ${{ inputs.base_ref || 'master' }}
  BOARD_CONFIGS: ${{ inputs.board_configs || 'frdm-imxrt1186:nsh' }}

jobs:
  check-build:
    name: Check and RT118x build
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       (startsWith(github.head_ref, 'feat/mimxrt1180-') ||
        startsWith(github.head_ref, 'feat/frdm-')))
    runs-on: [self-hosted, Linux, X64, aesl, esl-proxmox]
    timeout-minutes: 90
    container:
      image: ghcr.io/apache/nuttx/apache-nuttx-ci-linux@sha256:e4037bc11d6f3cc5ff0e6d908f2b42295a3fad6c41d1c623bae40ce85165a5d3
      options: --user root
    steps:
      - name: Record self-hosted runner
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Runner"
            echo
            echo "- Name: \`${RUNNER_NAME}\`"
            echo "- Environment: \`${RUNNER_ENVIRONMENT}\`"
            echo "- OS/arch: \`${RUNNER_OS}/${RUNNER_ARCH}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          hostname

      - name: Checkout NuttX feature ref
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TEST_REF }}
          fetch-depth: 0
          path: sources/nuttx

      - name: Checkout upstream nuttx-apps
        uses: actions/checkout@v7
        with:
          repository: apache/nuttx-apps
          ref: master
          fetch-depth: 1
          path: sources/apps

      - name: Fetch Apache contribution base
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE/sources/nuttx"
          if git -C sources/nuttx remote get-url apache >/dev/null 2>&1; then
            git -C sources/nuttx remote set-url apache https://github.com/apache/nuttx.git
          else
            git -C sources/nuttx remote add apache https://github.com/apache/nuttx.git
          fi
          git -C sources/nuttx fetch --no-tags apache "$BASE_REF"

      - name: Report human sign-off status
        shell: bash
        run: |
          set -euo pipefail
          cd sources/nuttx
          merge_base=$(git merge-base "apache/$BASE_REF" HEAD)
          missing=0
          while read -r commit; do
            if ! git show -s --format=%B "$commit" |
              git interpret-trailers --parse |
              awk -F ': ' '$1 == "Signed-off-by" { found=1 } END { exit !found }'
            then
              short_commit=$(git rev-parse --short=12 "$commit")
              subject=$(git show -s --format=%s "$commit")
              echo "::warning title=Missing human Signed-off-by::${short_commit} ${subject}"
              missing=$((missing + 1))
            fi
          done < <(git rev-list --reverse --no-merges "${merge_base}..HEAD")

          {
            echo "## Human sign-off"
            echo
            if ((missing > 0)); then
              echo "⚠️ ${missing} commit(s) are missing \`Signed-off-by\`."
              echo
              echo "This fork-only preflight is warn-only for DCO. A human"
              echo "\`Signed-off-by\` remains mandatory before any write to"
              echo "\`apache/nuttx\`."
            else
              echo "✅ All contribution commits include \`Signed-off-by\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run required checkpatch code-quality checks
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --yes --no-install-recommends python3.10-venv
          python_bin=
          for candidate in python3.12 python3.11 python3.10 python3; do
            if command -v "$candidate" >/dev/null 2>&1; then
              python_bin=$(command -v "$candidate")
              break
            fi
          done
          test -n "$python_bin"
          "$python_bin" -m venv "$RUNNER_TEMP/nuttx-check-venv"
          source "$RUNNER_TEMP/nuttx-check-venv/bin/activate"
          pip install codespell cmake-format black isort flake8 cvt2utf
          cd sources/nuttx
          merge_base=$(git merge-base "apache/$BASE_REF" HEAD)
          echo "Checking ${merge_base}..HEAD"
          tools/checkpatch.sh -c -u -m -g "${merge_base}..HEAD"

      - name: Build requested RT118x configurations with CMake
        shell: bash
        run: |
          set -euo pipefail
          read -r -a configs <<< "$BOARD_CONFIGS"
          ((${#configs[@]} > 0))
          for config in "${configs[@]}"; do
            [[ "$config" =~ ^[[:alnum:]_.-]+:[[:alnum:]_./-]+$ ]]
            build_dir="build-${config//:/-}"
            build_dir="${build_dir//\//-}"
            cmake -S sources/nuttx -B "$build_dir" -G Ninja \
              -DBOARD_CONFIG="$config" \
              -DNUTTX_APPS_DIR="$GITHUB_WORKSPACE/sources/apps"
            cmake --build "$build_dir" --parallel
            arm-none-eabi-size "$build_dir/nuttx"
          done

      - name: Reproduce Apache cibuild for requested configurations
        shell: bash
        run: |
          set -euo pipefail
          read -r -a configs <<< "$BOARD_CONFIGS"
          ((${#configs[@]} > 0))
          for config in "${configs[@]}"; do
            [[ "$config" =~ ^[[:alnum:]_.-]+:[[:alnum:]_./-]+$ ]]
          done
          printf '%s\n' "${configs[@]}" > "$RUNNER_TEMP/aesl-rt118x.dat"
          cd sources/nuttx/tools/ci
          ./cibuild.sh -c -A -N -R -S "$RUNNER_TEMP/aesl-rt118x.dat"

  lint:
    name: Apache Lint
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       (startsWith(github.head_ref, 'feat/mimxrt1180-') ||
        startsWith(github.head_ref, 'feat/frdm-')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout NuttX feature ref
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TEST_REF }}
          fetch-depth: 0

      - name: Reproduce Apache changed-file lint
        uses: github/super-linter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR runs set GITHUB_SHA to the ephemeral merge commit, which is not
          # in this checkout (ref = TEST_REF / PR head). Point super-linter at
          # the checked-out tip so changed-file discovery does not fail with
          # `fatal: bad object`.
          GITHUB_SHA: ${{ env.TEST_REF }}
          DEFAULT_BRANCH: master
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_PYTHON_BLACK: true
          VALIDATE_PYTHON_FLAKE8: true
          PYTHON_FLAKE8_CONFIG_FILE: setup.cfg
          VALIDATE_PYTHON_ISORT: true
          PYTHON_ISORT_CONFIG_FILE: setup.cfg
          VALIDATE_YAML: true

  documentation:
    name: Build Documentation
    if: >-
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        (startsWith(github.head_ref, 'feat/mimxrt1180-') ||
         startsWith(github.head_ref, 'feat/frdm-')))) &&
      (github.event_name != 'workflow_dispatch' || inputs.run_docs)
    runs-on: [self-hosted, Linux, X64, aesl, esl-proxmox]
    timeout-minutes: 45
    container:
      image: python@sha256:f398d30910ff241f726ab281c3d69ee460e7d9c3f45360fbe24b43386db17646
      options: --user root
    steps:
      - name: Record self-hosted runner
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Runner"
            echo
            echo "- Name: \`${RUNNER_NAME}\`"
            echo "- Environment: \`${RUNNER_ENVIRONMENT}\`"
            echo "- OS/arch: \`${RUNNER_OS}/${RUNNER_ARCH}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          hostname

      - name: Install documentation tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --yes --no-install-recommends git make plantuml
          pip install pipenv

      - name: Checkout NuttX feature ref
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TEST_REF }}
          fetch-depth: 1
          path: sources/nuttx

      - name: Reproduce Apache documentation build
        shell: bash
        env:
          PIPENV_VENV_IN_PROJECT: "1"
        run: |
          set -euo pipefail
          cd sources/nuttx/Documentation
          pipenv sync
          pipenv run make html
